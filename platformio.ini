; Mara X Meter
;
; Options, add them to the build_flags of an environment:
;   -DREED_PIN=16        GPIO of the reed sensor, default 16 (D0, polled). Any other GPIO is interrupt driven.

[platformio]
default_envs = d1_mini_usb

[env]
platform = espressif8266@^4.0.1
framework = arduino
; Same rate as the ESP8266 boot ROM, so boot messages and the firmware log share one monitor.
monitor_speed = 74880
build_flags = -Wall
lib_deps =
	zinggjm/GxEPD2@^1.6.9
	tzapu/WiFiManager@^2.0.17

[env:d1_mini_usb]
board = d1_mini
; Static analysis of src/ and lib/ with cppcheck: pio check -e d1_mini_usb
check_tool = cppcheck
check_src_filters = +<src/> +<lib/>
; unusedFunction is unreliable across files, the rest hides style notes about the libraries in .pio.
check_flags = cppcheck: --inline-suppr --suppress=unusedFunction --suppress=*:*.pio/*
check_skip_packages = yes

[env:d1_mini_ota]
board = d1_mini
upload_protocol = espota
upload_port = MaraXMonitor.local

; Host side unit tests for the hardware independent modules: pio test -e native
[env:native]
platform = native
framework =
lib_deps =
; The display library needs the panel driver and is left out, DisplayModel.hpp alone is plain C++ and tested.
build_flags = -std=c++17 -Wall -Ilib/Display
lib_ignore = Display
test_framework = unity
