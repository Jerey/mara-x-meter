name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:
    # Pinned on purpose: ubuntu-latest moves to a new release every two years.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core and clang-format
        run: pip install --upgrade platformio clang-format

      - name: Formatting (clang-format)
        run: clang-format --dry-run -Werror src/*.cpp lib/*/*.cpp lib/*/*.hpp test/*/*.cpp tools/preview/preview.cpp

      - name: Static analysis (cppcheck)
        run: pio check -e d1_mini_usb --fail-on-defect=medium --fail-on-defect=high

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e d1_mini_usb

      - name: Render the dashboard preview
        run: tools/preview/build.sh

  # A tag like v2.0 gets a GitHub release with the firmware attached, so it can be flashed without PlatformIO.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e d1_mini_usb
          cp .pio/build/d1_mini_usb/firmware.bin mara-x-meter-${{ github.ref_name }}.bin

      - name: Create the release
        run: gh release create "${{ github.ref_name }}" mara-x-meter-${{ github.ref_name }}.bin --title "${{ github.ref_name }}" --notes "Firmware for the D1 mini, see the readme on how to flash it."
        env:
          GH_TOKEN: ${{ github.token }}
